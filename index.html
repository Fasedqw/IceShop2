<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ice Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    padding: 16px;
    padding-bottom: 100px;
  }
  .header { text-align: center; padding: 20px 0; margin-bottom: 16px; }
  .header h1 { font-size: 28px; color: #4fc3f7; }
  .header p { color: #888; margin-top: 4px; font-size: 14px; }
  
  .admin-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    background: #2d2d44;
    color: #4fc3f7;
    border: 1px solid #4fc3f7;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    z-index: 50;
  }
  
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .card {
    background: #2d2d44; border-radius: 16px; padding: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    display: flex; flex-direction: column;
  }
  .card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 8px;
  }
  .card .name { font-weight: 600; font-size: 15px; margin-bottom: 4px; color: #fff; }
  .card .desc { font-size: 12px; color: #888; margin-bottom: 8px; flex-grow: 1; }
  .card .bottom { display: flex; justify-content: space-between; align-items: center; }
  .price { font-weight: 700; font-size: 16px; color: #4fc3f7; }
  .add-btn {
    background: #4fc3f7; color: #1a1a2e; border: none;
    border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .qty-control {
    display: flex; align-items: center; gap: 8px;
    background: #4fc3f7; border-radius: 10px; padding: 4px 8px; color: #1a1a2e;
  }
  .qty-control button {
    background: none; border: none; color: #1a1a2e;
    font-size: 18px; font-weight: 700; cursor: pointer; width: 22px; height: 22px;
  }
  .qty-control span { font-weight: 600; min-width: 16px; text-align: center; }
  
  .cart-bar {
    position: fixed; bottom: 16px; left: 16px; right: 16px;
    background: #4fc3f7; color: #1a1a2e; border-radius: 14px; padding: 14px 18px;
    display: none; justify-content: space-between; align-items: center;
    font-weight: 600; box-shadow: 0 4px 20px rgba(79, 195, 247, 0.4);
    cursor: pointer; z-index: 100;
  }
  .cart-bar.show { display: flex; }
  
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: none; align-items: flex-end; z-index: 200;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: #2d2d44; width: 100%; border-radius: 20px 20px 0 0;
    padding: 20px; max-height: 90vh; overflow-y: auto;
  }
  .modal h2 { margin-bottom: 12px; font-size: 20px; color: #fff; }
  .cart-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid #444; font-size: 14px;
  }
  .cart-item img {
    width: 50px; height: 50px; object-fit: cover; border-radius: 8px;
  }
  .cart-item-info { flex-grow: 1; color: #fff; }
  .total {
    display: flex; justify-content: space-between;
    padding: 14px 0; font-size: 18px; font-weight: 700; color: #fff;
  }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 13px; color: #888; margin-bottom: 4px; }
  .form-group input, .form-group textarea {
    width: 100%; padding: 12px; border: 1px solid #444;
    border-radius: 10px; background: #1a1a2e; color: #e0e0e0; font-size: 15px; font-family: inherit;
  }
  .form-group textarea { resize: none; height: 60px; }
  .submit-btn {
    width: 100%; padding: 14px; background: #4fc3f7; color: #1a1a2e;
    border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 8px;
  }
  .close-btn {
    background: none; border: none; font-size: 24px;
    float: right; cursor: pointer; color: #888;
  }
  
  /* Админ-панель */
  .admin-panel {
    background: #2d2d44;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 20px;
  }
  .admin-panel h3 { color: #4fc3f7; margin-bottom: 12px; }
  .product-list { margin-top: 16px; }
  .product-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    background: #1a1a2e;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .product-item img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 8px;
    margin-right: 10px;
  }
  .product-item-info { flex-grow: 1; }
  .product-item-info .name { color: #fff; font-weight: 600; }
  .product-item-info .price { color: #4fc3f7; font-size: 13px; }
  .delete-btn {
    background: #ff4444;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .file-input {
    display: block;
    margin: 10px 0;
    color: #888;
  }
  .file-input input[type="file"] {
    margin-top: 6px;
  }
</style>
</head>
<body>

<button class="admin-btn" onclick="openAdmin()">⚙️ Админ</button>

<div class="header">
  <h1>🍦 Ice Shop</h1>
  <p>Свежее мороженое с доставкой</p>
</div>

<div class="grid" id="products"></div>

<div class="cart-bar" id="cartBar" onclick="openCheckout()">
  <span>🛒 Корзина (<span id="cartCount">0</span>)</span>
  <span><span id="cartTotal">0</span> ₽</span>
</div>

<!-- Модалка оформления заказа -->
<div class="modal" id="checkoutModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeCheckout()">✕</button>
    <h2>Оформление заказа</h2>
    <div id="cartItems"></div>
    <div class="total">
      <span>Итого:</span>
      <span><span id="modalTotal">0</span> ₽</span>
    </div>
    <form id="orderForm">
      <div class="form-group">
        <label>📞 Телефон *</label>
        <input type="tel" id="phone" placeholder="+7 999 123 45 67" required>
      </div>
      <div class="form-group">
        <label>📍 Адрес доставки *</label>
        <input type="text" id="address" placeholder="ул. Ленина, д. 1" required>
      </div>
      <div style="display:flex; gap:8px;">
        <div class="form-group" style="flex:1;">
          <label>🚪 Подъезд</label>
          <input type="text" id="entrance" placeholder="1">
        </div>
        <div class="form-group" style="flex:1;">
          <label>🏠 Этаж / кв.</label>
          <input type="text" id="floorApt" placeholder="3 / 25">
        </div>
      </div>
      <div class="form-group">
        <label>💬 Комментарий</label>
        <textarea id="comment" placeholder="Позвонить за 5 минут..."></textarea>
      </div>
      <button type="submit" class="submit-btn">Оформить заказ 🚀</button>
    </form>
  </div>
</div>

<!-- Модалка админки -->
<div class="modal" id="adminModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeAdmin()">✕</button>
    <h2>⚙️ Админ-панель</h2>
    
    <div id="adminLogin">
      <div class="form-group">
        <label>🔐 Пароль администратора</label>
        <input type="password" id="adminPassword" placeholder="Введите пароль">
      </div>
      <button class="submit-btn" onclick="checkAdminPassword()">Войти</button>
    </div>
    
    <div id="adminContent" style="display:none;">
      <div class="admin-panel">
        <h3>➕ Добавить товар</h3>
        <div class="form-group">
          <label>Название товара *</label>
          <input type="text" id="newProductName" placeholder="Например: Ванильное">
        </div>
        <div class="form-group">
          <label>Описание</label>
          <input type="text" id="newProductDesc" placeholder="Краткое описание">
        </div>
        <div class="form-group">
          <label>Цена (₽) *</label>
          <input type="number" id="newProductPrice" placeholder="150">
        </div>
        <div class="form-group">
          <label>📸 Фото товара</label>
          <input type="file" id="newProductImage" accept="image/*" class="file-input">
        </div>
        <button class="submit-btn" onclick="addProduct()">Добавить товар</button>
      </div>
      
      <div class="admin-panel">
        <h3>📦 Список товаров</h3>
        <div id="productList" class="product-list"></div>
      </div>
      
      <button class="submit-btn" onclick="exportProducts()" style="background:#2d2d44; color:#4fc3f7; border:1px solid #4fc3f7;">💾 Экспорт товаров (JSON)</button>
    </div>
  </div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const ADMIN_PASSWORD = "admin123"; // ⚠️ ИЗМЕНИ ПАРОЛЬ!
  const IMG_BASE = "https://github.com/Fasedqw/IceShop2/raw/main/images/";

  // Товары по умолчанию
  const defaultProducts = [
    { id: 1, img: "1.jpg", name: "Ванильное", desc: "Классика в вафельном стаканчике", price: 120 },
    { id: 2, img: "2.jpg", name: "Шоколадное", desc: "Бельгийский шоколад", price: 140 },
    { id: 3, img: "3.jpg", name: "Клубничное", desc: "С кусочками ягод", price: 150 },
    { id: 4, img: "4.jpg", name: "Манго-маракуйя", desc: "Тропический микс", price: 170 },
    { id: 5, img: "5.jpg", name: "Cookie Dough", desc: "С кусочками печенья", price: 180 },
    { id: 6, img: "6.jpg", name: "Кокос-миндаль", desc: "Веганское, без молока", price: 190 },
    { id: 7, img: "7.jpg", name: "Бабл-ти", desc: "Холодный чай с тапиокой", price: 220 },
    { id: 8, img: "8.jpg", name: "Сорбет лимон", desc: "Освежающий, 0% жира", price: 130 }
  ];

  // Загрузка товаров из localStorage или использование default
  let products = JSON.parse(localStorage.getItem('iceShopProducts')) || defaultProducts;
  let cart = {};
  let nextId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;

  function saveProducts() {
    localStorage.setItem('iceShopProducts', JSON.stringify(products));
  }

  function renderProducts() {
    const grid = document.getElementById("products");
    grid.innerHTML = products.map(p => {
      const qty = cart[p.id] ? cart[p.id].qty : 0;
      const controls = qty === 0
        ? '<button class="add-btn" onclick="addToCart(' + p.id + ')">+ В корзину</button>'
        : '<div class="qty-control">' +
          '<button onclick="changeQty(' + p.id + ', -1)">−</button>' +
          '<span>' + qty + '</span>' +
          '<button onclick="changeQty(' + p.id + ', 1)">+</button>' +
          '</div>';
      return '<div class="card">' +
        '<img src="' + (p.img.startsWith('data:') ? p.img : IMG_BASE + p.img) + '" alt="' + p.name + '">' +
        '<div class="name">' + p.name + '</div>' +
        '<div class="desc">' + p.desc + '</div>' +
        '<div class="bottom">' +
        '<div class="price">' + p.price + ' ₽</div>' +
        controls +
        '</div></div>';
    }).join("");
  }

  function addToCart(id) {
    const p = products.find(x => x.id === id);
    cart[id] = { id: p.id, img: p.img, name: p.name, price: p.price, qty: 1 };
    updateCart();
  }
  function changeQty(id, delta) {
    if (!cart[id]) return;
    cart[id].qty += delta;
    if (cart[id].qty <= 0) delete cart[id];
    updateCart();
  }
  function updateCart() {
    const items = Object.values(cart);
    const count = items.reduce((s, i) => s + i.qty, 0);
    const total = items.reduce((s, i) => s + i.qty * i.price, 0);
    document.getElementById("cartCount").textContent = count;
    document.getElementById("cartTotal").textContent = total;
    document.getElementById("cartBar").classList.toggle("show", count > 0);
    renderProducts();
  }

  function openCheckout() {
    const items = Object.values(cart);
    const total = items.reduce((s, i) => s + i.qty * i.price, 0);
    document.getElementById("cartItems").innerHTML = items.map(i =>
      '<div class="cart-item">' +
      '<img src="' + (i.img.startsWith('data:') ? i.img : IMG_BASE + i.img) + '" alt="' + i.name + '">' +
      '<div class="cart-item-info"><b>' + i.name + '</b> × ' + i.qty + '</div>' +
      '<span>' + (i.price * i.qty) + ' ₽</span></div>'
    ).join("");
    document.getElementById("modalTotal").textContent = total;
    document.getElementById("checkoutModal").classList.add("show");
  }
  function closeCheckout() {
    document.getElementById("checkoutModal").classList.remove("show");
  }

  // Админ-панель
  function openAdmin() {
    document.getElementById("adminModal").classList.add("show");
    document.getElementById("adminLogin").style.display = "block";
    document.getElementById("adminContent").style.display = "none";
    document.getElementById("adminPassword").value = "";
  }
  function closeAdmin() {
    document.getElementById("adminModal").classList.remove("show");
  }
  function checkAdminPassword() {
    const pwd = document.getElementById("adminPassword").value;
    if (pwd === ADMIN_PASSWORD) {
      document.getElementById("adminLogin").style.display = "none";
      document.getElementById("adminContent").style.display = "block";
      renderProductList();
    } else {
      alert("❌ Неверный пароль!");
    }
  }

  function addProduct() {
    const name = document.getElementById("newProductName").value.trim();
    const desc = document.getElementById("newProductDesc").value.trim();
    const price = parseInt(document.getElementById("newProductPrice").value);
    const fileInput = document.getElementById("newProductImage");
    
    if (!name || !price) {
      alert("⚠️ Заполни название и цену!");
      return;
    }

    if (fileInput.files && fileInput.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        products.push({
          id: nextId++,
          img: e.target.result, // base64
          name: name,
          desc: desc || "Без описания",
          price: price
        });
        saveProducts();
        renderProducts();
        renderProductList();
        
        // Очистка формы
        document.getElementById("newProductName").value = "";
        document.getElementById("newProductDesc").value = "";
        document.getElementById("newProductPrice").value = "";
        fileInput.value = "";
        
        alert("✅ Товар добавлен!");
      };
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      products.push({
        id: nextId++,
        img: "default.jpg",
        name: name,
        desc: desc || "Без описания",
        price: price
      });
      saveProducts();
      renderProducts();
      renderProductList();
      
      document.getElementById("newProductName").value = "";
      document.getElementById("newProductDesc").value = "";
      document.getElementById("newProductPrice").value = "";
      
      alert("✅ Товар добавлен! (без фото)");
    }
  }

  function deleteProduct(id) {
    if (confirm("Удалить этот товар?")) {
      products = products.filter(p => p.id !== id);
      saveProducts();
      renderProducts();
      renderProductList();
    }
  }

  function renderProductList() {
    const list = document.getElementById("productList");
    list.innerHTML = products.map(p =>
      '<div class="product-item">' +
      '<img src="' + (p.img.startsWith('data:') ? p.img : IMG_BASE + p.img) + '" alt="' + p.name + '">' +
      '<div class="product-item-info">' +
      '<div class="name">' + p.name + '</div>' +
      '<div class="price">' + p.price + ' ₽</div>' +
      '</div>' +
      '<button class="delete-btn" onclick="deleteProduct(' + p.id + ')">🗑 Удалить</button>' +
      '</div>'
    ).join("");
  }

  function exportProducts() {
    const dataStr = JSON.stringify(products, null, 2);
    const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "products.json";
    a.click();
    alert("💾 Товары экспортированы! Сохрани этот файл — он понадобится для постоянного хранения.");
  }

  document.getElementById("orderForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const items = Object.values(cart).map(i => ({
      id: i.id, name: i.name, price: i.price, qty: i.qty
    }));
    const total = items.reduce((s, i) => s + i.qty * i.price, 0);
    const payload = {
      action: "order",
      items: items,
      total: total,
      contact: {
        phone: document.getElementById("phone").value,
        address: document.getElementById("address").value,
        entrance: document.getElementById("entrance").value,
        floorApt: document.getElementById("floorApt").value,
        comment: document.getElementById("comment").value
      }
    };
    tg.sendData(JSON.stringify(payload));
    tg.close();
  });

  renderProducts();
</script>
</body>
</html>
